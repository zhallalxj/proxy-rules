name: Sync Meta and Muse rules
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Muse-Custom.list'
      - 'scripts/sync_muse.py'
      - '.github/workflows/sync-muse.yml'

permissions:
  contents: write

concurrency:
  group: sync-muse
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and merge rules
        run: python3 scripts/sync_muse.py
      - name: Commit generated rules if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Meta.list Muse.list Muse-Supplement.list
          if git diff --cached --quiet; then
            echo 'Rules unchanged'
          else
            git commit -m 'chore: sync Meta and Muse rules'
            git push origin HEAD:main
          fi
